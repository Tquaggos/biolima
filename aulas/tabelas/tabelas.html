<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <table border="1"> 
          <!--Estrutura da Tabela-->  
        <thead>
            <tr>    <!-- Linhas-->
                <th>Nome</th>  <!--Define o valor do cabeçalho-->
                <th>Idade</th>  <!--Define o valor do cabeçalho-->
                <th>Cidade</th> <!--Define o valor do cabeçalho-->
            </tr><!--Linha-->
        </thead>  <!--Cabeçalho da tabela-->

        <tbody>
            <tr>
                <td>Mateus</td>
                <td>35</td>
                <td>São Paulo</td>
            </tr>

            <tr>
                <td>Igor</td>
                <td>20</td>
                <td>Embu das Artes</td>
            </tr>

            <tr>
                <td>Pedrão</td>
                <td>17</td>
                <td>São Paulo</td>
            </tr>
        </tbody><!--Corpo da tabela-->
    </table>
</body>
</html>
